[package]
name = "chda-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
chda-config.workspace = true
chda-core.workspace = true
chda-term.workspace = true
chda-pty.workspace = true
serde_json.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSDockTile",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-foundation = { workspace = true, features = [
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSLocale",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
] }
objc2-user-notifications = { workspace = true, features = [
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
