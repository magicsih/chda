name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ZIG_VERSION: 0.15.2

jobs:
  docs:
    name: product docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-product-docs.py
      - run: python3 scripts/sync-product-docs.py --check

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all --check

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-commits.sh "$BASE..HEAD" "$TITLE"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            scripts/check-commits.sh "HEAD~1..HEAD"
          else
            scripts/check-commits.sh "$BEFORE..HEAD"
          fi

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: 1.98.1
          command: check

  macos:
    name: macOS test
    runs-on: macos-latest
    env:
      # Zig 0.15.2 cannot link against the macOS 26.4+ SDK (arm64e-only
      # .tbd targets, ziglang/zig#31658). Xcode 26.3 ships the 26.2 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan1 libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
