name: Linux public smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Linux stable tag
        required: true
      candidate_sha:
        description: Exact published candidate commit SHA
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Public Linux download (${{ matrix.format }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, archive]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PACKAGE_FORMAT: ${{ matrix.format }}
      NATIVE_IMAGE: ubuntu:24.04@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - name: Validate release identifiers
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch('v[0-9]+[.][0-9]+[.][0-9]+', os.environ['RELEASE_TAG'])
          assert re.fullmatch('[0-9a-f]{40}', os.environ['CANDIDATE_SHA'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Read the public release and download without authentication
        run: |
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$CANDIDATE_SHA"
          mkdir packages native-evidence
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o native-evidence/public-release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('native-evidence/public-release.json'))
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert not release['draft'] and not release['prerelease']
          PY
          version=${RELEASE_TAG#v}
          for name in "chda-$version-linux-x86_64.AppImage" \
            "chda-$version-linux-x86_64.tar.gz" \
            "chda-$version-linux-dependency-sources.tar.gz" linux-build.json SHA256SUMS; do
            curl --fail --location --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name" \
              -o "packages/$name"
          done
          (cd packages && sha256sum --check SHA256SUMS)
      - name: Build the isolated runtime
        run: docker build --build-arg "BASE_IMAGE=$NATIVE_IMAGE" -t chda-native tests/linux-native
      - name: Execute the downloaded public package
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/packages:/packages:ro" \
            -v "$GITHUB_WORKSPACE/native-evidence:/evidence" \
            -e NATIVE_IMAGE -e PACKAGE_FORMAT -e RUNNER_ARCH -e CANDIDATE_SHA chda-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-public-smoke-${{ matrix.format }}
          path: native-evidence
          retention-days: 3
