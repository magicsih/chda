name: Linux native review

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful main Linux packages run containing the final candidate
        required: true
      candidate_sha:
        description: Full candidate commit SHA from that run
        required: true

permissions:
  contents: read
  actions: read

jobs:
  review:
    name: Native round ${{ matrix.round }} (${{ matrix.session }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        include:
          - session: x11
            backend: x11
            format: archive
            stage: full
            compositor: mutter
          - session: wayland
            backend: wayland
            format: appimage
            stage: full
            compositor: mutter
          - session: wayland-ime
            backend: wayland
            format: appimage
            stage: ime-wayland
            compositor: labwc
        session: [x11, wayland, wayland-ime]
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ARTIFACT_RUN: ${{ inputs.artifact_run }}
      NATIVE_IMAGE: debian:trixie-slim@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483
      NATIVE_STAGE: ${{ matrix.stage }}
      COMPOSITOR: ${{ matrix.compositor }}
      DISPLAY_BACKEND: ${{ matrix.backend }}
      PACKAGE_FORMAT: ${{ matrix.format }}
      REVIEW_ROUND: ${{ matrix.round }}
    steps:
      - name: Validate candidate identifiers
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['CANDIDATE_SHA'])
          assert re.fullmatch('[0-9]+', os.environ['ARTIFACT_RUN'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify the successful main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" > "$RUNNER_TEMP/build-run.json"
          python3 - <<'PY'
          import json, os
          run = json.load(open(os.environ['RUNNER_TEMP'] + '/build-run.json'))
          assert run['conclusion'] == 'success'
          assert run['head_branch'] == 'main'
          assert run['head_sha'] == os.environ['CANDIDATE_SHA']
          assert run['path'] == '.github/workflows/linux.yml'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: packages
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Build the isolated desktop
        run: docker build --build-arg "BASE_IMAGE=$NATIVE_IMAGE" --build-arg FULL_DESKTOP=1 -t chda-native tests/linux-native
      - name: Record the round plan and execute it
        run: |
          mkdir native-evidence
          cp tests/linux-native/rounds.json native-evidence/planned-rounds.json
          cp "$RUNNER_TEMP/build-run.json" native-evidence/build-run.json
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/packages:/packages:ro" \
            -v "$GITHUB_WORKSPACE/native-evidence:/evidence" \
            -e NATIVE_IMAGE -e PACKAGE_FORMAT -e RUNNER_ARCH -e CANDIDATE_SHA \
            -e NATIVE_STAGE -e COMPOSITOR -e DISPLAY_BACKEND -e REVIEW_ROUND chda-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-native-round-${{ matrix.round }}-${{ matrix.session }}
          path: |
            native-evidence
            !native-evidence/session/cache/**
          retention-days: 3
