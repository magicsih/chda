name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Both jobs need RELEASE_TOKEN (a fine-grained PAT): a tag or pull request
  # made with GITHUB_TOKEN would not trigger CI or the Release workflow.
  token:
    name: Check token
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: echo "present=$([ -n "$RELEASE_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Merging the release pull request tags `v<version>`, which runs release.yml.
  release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: token
    if: needs.token.outputs.present == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Keep one pull request open with the next version and changelog.
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
