name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/media/**"
      - "docs/product-features.json"
      - "README.md"
      - "scripts/sync-product-docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate product docs
        run: python3 scripts/sync-product-docs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v5
